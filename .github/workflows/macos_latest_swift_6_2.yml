name: macOS (latest), Swift 6.2

on:
  push:
    branches:
      - mainline

jobs:
  build:
    name: macOS (latest), Swift 6.2
    runs-on: macos-latest
    steps:
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.1"
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
